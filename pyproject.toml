[build-system]
requires = ["scikit-build-core>=0.11,<2", "pybind11==3.1.0", "jinja2>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "pytissu"
version = "1.1.0"
description = "A cloth simulation SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Evan Miranda" }]
keywords = ["cloth", "simulation", "physics", "3d"]

dependencies = [
    "numpy",
    "tqdm",
    "matplotlib",
    "imageio",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "jinja2"]

[project.urls]
Homepage = "https://github.com/evanrock520-ciencias/Tissu"
Repository = "https://github.com/evanrock520-ciencias/Tissu.git"
Issues = "https://github.com/evanrock520-ciencias/Tissu/issues"

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.29"
cmake.args = ["--preset", "package"]
build.targets = ["_cloth_sdk_core"]
install.components = ["python"]
# Source exclusions keep local binaries out; CMake installs the new extension.
wheel.packages = ["python/tissu"]
sdist.exclude = [
    ".github", ".agents", ".aws", ".codex", ".venv", "build", "dist",
    "data", "docs/assets", "examples/jupyter", "benchmarks/storage",
    "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib", "**/__pycache__",
    "**/*.egg-info", "CMakeUserPresets.json",
]

[tool.cibuildwheel]
build = "cp{310,311,312,313,314}-*"
skip = "*-musllinux_*"
archs = ["native"]
build-frontend = "build[uv]"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", OMP_NUM_THREADS = "2", MPLBACKEND = "Agg" }
test-requires = ["pytest"]
test-sources = ["tests/python"]
test-command = "python -m pytest tests/python -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y git"

[tool.cibuildwheel.macos]
before-all = "brew install libomp"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM"
]
ignore = ["N801", "N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
dev = [
    "fake-bpy-module-latest>=20260722",
]
