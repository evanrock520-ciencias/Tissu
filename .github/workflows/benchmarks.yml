name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Number of repetitions per benchmark
        default: '3'
        type: choice
        options: ['1', '3', '5', '10']
      runner_os:
        description: Runner operating system
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - macos-14
          - windows-2022

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner_os }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'
  OMP_NUM_THREADS: '2'

jobs:
  run-benchmarks:
    name: Benchmarks (${{ inputs.runner_os }})
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        id: tools
        uses: ./.github/actions/setup-build
        with:
          cache-key: benchmarks

      - name: Configure and build benchmarks
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build/benchmarks
          args: --preset benchmarks
          options: |
            "Python_EXECUTABLE=${{ steps.tools.outputs.python-path }}"
            CMAKE_LINKER_TYPE=${{ runner.os == 'Linux' && 'MOLD' || 'DEFAULT' }}
            TISSU_USE_CCACHE=${{ runner.os != 'Windows' && 'ON' || 'OFF' }}
          build-args: --target tissu_benchmarks

      - name: Run benchmarks
        shell: bash
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          mkdir -p benchmarks/results
          ./build/benchmarks/bin/tissu_benchmarks \
            --benchmark_out=benchmarks/results/benchmark_results.json \
            --benchmark_out_format=json \
            --benchmark_repetitions="$REPETITIONS" \
            --benchmark_report_aggregates_only=true

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ runner.os }}-${{ runner.arch }}
          path: benchmarks/results/*.json
          if-no-files-found: error
          retention-days: 30
