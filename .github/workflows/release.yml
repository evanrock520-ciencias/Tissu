name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04
            preset: linux-release
          - os: windows-2022
            preset: windows-release
          - os: macos-15
            preset: macos-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        id: tools
        uses: ./.github/actions/setup-build
        with:
          python-version: ${{ matrix.python-version }}
          cache-key: release-${{ matrix.preset }}

      - name: Install Python tools
        run: uv pip install mypy numpy tqdm matplotlib imageio build wheel setuptools

      - name: Build native extension
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build/${{ matrix.preset }}
          args: --preset ${{ matrix.preset }}
          options: |
            "Python_EXECUTABLE=${{ steps.tools.outputs.python-path }}"
            BUILD_TESTING=OFF

      - name: Build wheel
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export _PYTHON_HOST_PLATFORM="macosx-11.0-arm64"
          fi
          python -m build --wheel --no-isolation --outdir wheelhouse_temp/

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          uv pip install auditwheel
          auditwheel repair wheelhouse_temp/*.whl -w dist/

      - name: Repair wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv pip install delvewheel
          for whl in wheelhouse_temp/*.whl; do
              python -m delvewheel repair "$whl" -w dist/
          done

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          uv pip install delocate
          delocate-wheel -w dist/ -v wheelhouse_temp/*.whl

      - name: Build sdist (Linux only)
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        run: python -m build --sdist --no-isolation

      - name: Smoke test repaired wheel
        shell: bash
        run: |
          for whl in dist/*.whl; do
            uv run --isolated --no-project --with "$whl" python -c \
              "from tissu import Simulation; sim = Simulation(); sim.create_grid(name='cloth', rows=2, cols=2, spacing=0.1); sim.step(); assert sim.positions.shape == (4, 3)"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tissu-wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        with:
          name: tissu-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tissu-*
          merge-multiple: true
          path: dist/

      - name: Check dist contents
        run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
