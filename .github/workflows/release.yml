name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.archive.outputs.filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
          python-version: '3.12'
          activate-environment: true
          enable-cache: true

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG'].removeprefix('v')
          if tag != version:
              raise SystemExit(f'Release tag {tag!r} does not match package version {version!r}')
          PY

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Locate source archive
        id: archive
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          archive, = Path('dist').glob('*.tar.gz')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'filename={archive.name}', file=output)
          PY

      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tissu-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.7'
          python-version: '3.12'
          activate-environment: true
          enable-cache: true

      # The cibuildwheel action bootstraps its tool environment through pip.
      - name: Install the action's bootstrap dependency
        run: uv pip install pip

      - name: Download source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tissu-sdist
          path: dist

      - name: Build, repair and test wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          python-path: python
          package-dir: dist/${{ needs.sdist.outputs.filename }}
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tissu-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tissu-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
